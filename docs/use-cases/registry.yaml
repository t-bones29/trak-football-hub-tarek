# Test-harness contracts for Trak's application use cases.
# Current pilot scope: MVP Requirements (J1–J8). Deployment evidence:
# docs/use-cases/PILOT-INDEX.md. Enforced/pending/parked are harness statuses.
# Historical REQ identifiers and commit-pinned sources retain provenance;
# they do not re-admit a parked feature to the pilot.
# Product-owner-owned. Changing a given/when/then requires bumping that
# entry's spec_version — scripts/uc-check.mjs enforces this via
# registry.lock.json.
version: 1
owner: "@kostasanastasioubusiness-lang"
use_cases:
  # PARKED 2026-09-21. Imad confirmed coach-only match logging for the pilot;
  # academy-led admission has no athlete self-reporting path. The route these
  # assert (/player/log) does not exist and is not planned, so the assertions
  # were failing against an absent feature rather than against a defect.
  #
  # `parked` is the harness's existing third status, not a new one invented
  # here — it is already in the UseCaseStatus type, the support test and
  # uc-report's sections. Only uc-check.mjs did not know it, which is fixed
  # alongside this.
  #
  # The disposition is stated, not silenced. `parked` would make useCase()
  # skip the suite, and a permanently skipped test reads as coverage; the file
  # is deleted instead. `then` keeps the PO's original words so the decision
  # stays auditable if athlete logging is ever revived.
  - id: UC-A02
    actor: athlete
    title: Log a match with position inputs and live band preview
    requirement: REQ-001
    status: parked
    tier: [1, 2]
    spec_version: 2
    given: A signed-in pilot athlete on mobile web
    when: They complete the match log form and tap save
    then:
      - A matches row is persisted with a computed rating
      - They are taken to the result screen for that match
      - No decimal number is rendered anywhere in the UI
    source: https://github.com/kostasanastasioubusiness-lang/trak-football-hub/blob/d0ed55ff618ee0a0b943399236527f9e3f7ebbb5/docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

