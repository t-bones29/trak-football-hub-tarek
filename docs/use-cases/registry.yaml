  # REWRITTEN 2026-09-23 (Q-2026-09-23-01, TRAK-19). The consent threshold is
  # 18, not 13–14, and consent is given by an academy-supplied guardian (J2).
  - id: UC-P07
    actor: parent
    title: A guardian gives recorded consent for a child under 18
    requirement: J2
    status: pending
    tier: [1, 2]
    spec_version: 2
    given: A guardian invited by the academy for a child under 18, or with no date of birth
    when: They complete the consent screen
    then:
      - The flow cannot complete without a recorded consent
      - The consent record stores the guardian's name, relationship and the notice version, and is timestamped
      - No development record about the child can be written before consent exists
      - One guardian can consent for siblings without a second account
    source: MVP Requirements

  # RECONCILED 2026-10-08 with TRAK-10's 25–30 Sep decisions and J7.
  # v1 counted player-entered match logs; J7 measures the coach-led loop.
  - id: UC-T01
    actor: system
    title: Answer the weekly coach-assessment and family-open counts in one minute
    requirement: J7
    status: pending
    tier: [2]
    spec_version: 2
    given: A configured pilot cohort with real UI events and synthetic rehearsal accounts
    when: An authorized operator runs the weekly pilot measurement query
    then:
      - Assessments per coach and player and parent opens can be answered in under one minute
      - Only the configured academy's events count and synthetic accounts are excluded from pilot reporting
      - Player opens count distinct player and assessment pairs per week when the published message is shown
      - Parent opens count distinct parent and assessment pairs per week when the assessment bands are shown
      - Counts match the qualifying underlying events, not raw repeated page views
      - Showing a message is not represented as proof the child deliberately opened or read it
    source: MVP Requirements

  - id: UC-X01
    actor: system
    title: No role reads data belonging to anyone they are not linked to
    requirement: REQ-004
    status: pending
    tier: [2]
    spec_version: 1
    given: Two unlinked accounts of any roles
    when: One attempts to read the other's rows
    then:
      - The read is rejected rather than returning an empty result
    source: https://github.com/kostasanastasioubusiness-lang/trak-football-hub/blob/d0ed55ff618ee0a0b943399236527f9e3f7ebbb5/docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # ENFORCED 2026-09-21. Its test passed on every uc:check run since the
  # 2026-09-21 merges; Imad approved promoting it (Tarek's offer, #77 thread).
  - id: UC-X02
    actor: system
    title: A failed load never renders as a false empty state
    requirement: REQ-004
    status: enforced
    tier: [1]
    spec_version: 2
    given: Any data-backed screen
    when: The request fails or the network is unavailable
    then:
      - A retryable error is shown
      - The error is visibly different from the genuine empty state
    source: https://github.com/kostasanastasioubusiness-lang/trak-football-hub/blob/d0ed55ff618ee0a0b943399236527f9e3f7ebbb5/docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # ADDED 2026-09-23 (Q-2026-09-23-01, TRAK-19): use cases for the P0 journeys
  # J1–J4 in MVP Requirements. Pending until a test exists and passes.
  - id: UC-X03
    actor: system
    title: Only rostered children and academy-supplied guardians get a profile
    requirement: J1
    status: pending
    tier: [2]
    spec_version: 1
    given: A person with no valid academy invitation
    when: They sign up as a player or a parent, or try to link to a child by name or code
    then:
      - The backend refuses the player or parent profile
      - No squad row or parent link is created
      - An invited child and guardian can complete signup (positive control)
    source: MVP Requirements

  - id: UC-X04
    actor: system
    title: A player cannot change their own date of birth
    requirement: J1
    status: pending
    tier: [2]
    spec_version: 1
    given: A signed-in player
    when: They try to change their date of birth through the app or the API
    then:
      - The change is refused by the backend
      - A player with no date of birth is treated as under 18
    source: MVP Requirements

  - id: UC-P08
    actor: parent
    title: Guardian invitation is sent at admission to the academy-supplied address
    requirement: J2
    status: pending
    tier: [2]
    spec_version: 2
    given: A child admitted from the academy roster with one or more guardian emails
    when: Admission completes
    then:
      - Each academy-supplied guardian email receives an invitation within 60 seconds of admission
      - It arrives in the inbox, not in spam, at both a Gmail and an Outlook address
      - The invitation names the child, the academy and the purpose
      - It carries Trak branding and a safe-sender line
      - No invitation goes to an address the academy did not supply, or to the child's own address
    source: MVP Requirements

  - id: UC-P09
    actor: parent
    title: Withdraw consent in one tap, effective immediately
    requirement: J2
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A signed-in guardian whose consent for a child is active
    when: They withdraw consent from their profile
    then:
      - Withdrawal is one action from the parent profile, with the child named
      - New development writes about the child are refused at once, including from sessions already open
      - Published content about the child is hidden from the family at once
    source: MVP Requirements

  # RECONCILED 2026-10-08 with TRAK-84/103/104/107 and J3.
  # v2 retains consent-first activation and adds the decided no-email path.
  - id: UC-A11
    actor: athlete
    title: Activate and recover a rostered child's account only through the approved paths
    requirement: J3
    status: pending
    tier: [1, 2]
    spec_version: 2
    given: A child admitted from the academy roster, with or without their own email
    when: Their guardian consents and the family completes the applicable account setup
    then:
      - Neither an activation invitation nor a guardian-created child login is available before active consent
      - With a child email, the invitation goes only to the academy-supplied address and the child enters its code at /auth/code
      - Without a child email, the approved guardian creates the child's username and password
      - The account is linked to the child's roster row and uses the roster name
      - Used or expired codes are refused, and after a resend only the newest code works
      - A guardian can reset their no-email child's password and existing child sessions are invalidated, with an open device signing out within 30 seconds
    source: MVP Requirements

  - id: UC-C09
    actor: coach
    title: Log a match for the squad with no invented defaults
    requirement: J4
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A signed-in coach with a squad
    when: They log a match with date, opponent and result, and each child's position, minutes, goals and assists
    then:
      - Nothing about a child's minutes, goals or assists is pre-filled
      - A child whose guardian has not consented cannot be logged
      - A retry never creates a duplicate match, and a partial failure says what was and was not saved
