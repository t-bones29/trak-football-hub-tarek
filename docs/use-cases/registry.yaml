  # pending in this harness; deployment evidence is recorded in PILOT-INDEX.
  - id: UC-C02
    actor: coach
    title: Coaches do not add players; the academy roster decides the squad
    requirement: J1
    status: pending
    tier: [1, 2]
    spec_version: 2
    given: A signed-in coach
    when: They open their squad, or go to /coach/squad/add directly
    then:
      - The squad screen offers no way to add a player
      - /coach/squad/add shows no add-player form and sends the coach to their squad
      - A squad_players insert by a coach is refused by the backend
